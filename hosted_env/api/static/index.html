<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFL Model -- Live</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#14171C">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171C; --surface: #1D2128; --border: #2A2F38;
    --text: #EDEBE6; --muted: #8B92A0;
    --signal: #F2C14E;      /* ONLY for real, computed model output -- never anything else */
    --pending: #4A5568;     /* honest "not yet available" states -- visually distinct from signal */
    --pending-bg: #262b35;
    /* Real market-observational colors only -- never a betting recommendation. Darker,
       desaturated so they read as informational against the charcoal ground, not alarming. */
    --best: #5B9279; --best-bg: #1c2620;
    --worst: #C4695E; --worst-bg: #291d1c;
    --shift: #d98c3f; --shift-bg: #2b2015;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    padding-bottom: 40px;
  }
  h1, h2, .teams, .week-label { font-family: "Oswald", "Inter", sans-serif; }
  header {
    padding: 14px 16px 10px; display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: 0.02em; color: var(--muted); }
  select#sport-select {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; font-size: 13px; font-family: "Inter", sans-serif;
  }
  .week-nav {
    margin: 0 16px 10px; position: relative;
  }
  .week-label {
    display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.03em; background: none; border: none;
    color: var(--text); padding: 4px 0; cursor: pointer; font-family: "Oswald", sans-serif;
  }
  .week-label .chevron { font-size: 14px; color: var(--muted); font-family: "Inter", sans-serif; }
  .week-dropdown {
    position: absolute; top: 100%; left: 0; z-index: 10; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; margin-top: 4px;
    max-height: 320px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    display: none; min-width: 160px;
  }
  .week-dropdown.open { display: block; }
  .week-dropdown button {
    display: block; width: 100%; text-align: left; background: none; border: none;
    color: var(--text); font-size: 14px; font-family: "Inter", sans-serif; padding: 9px 14px;
    cursor: pointer;
  }
  .week-dropdown button:hover { background: var(--pending-bg); }
  .week-dropdown button.current { color: var(--signal); font-weight: 600; }
  #model-banner {
    margin: 0 16px 12px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; font-size: 12px; color: var(--muted);
  }
  #model-banner b { color: var(--signal); }
  main { padding: 0 16px; }
  /* Real, deliberate ticker-row layout -- not rounded SaaS cards -- per the established design
     system: dense, scannable rows, consistent with a scoreboard-ticker visual language. */
  .game-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 10px 12px; margin-bottom: 4px; cursor: pointer;
  }
  .game-row:hover { border-color: #3a4150; }
  .game-row .teams { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .game-row .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .status-pill {
    display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 0.03em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap;
    background: var(--pending-bg); color: var(--pending);
  }
  .status-pill.ready { background: #2a2410; color: var(--signal); }
  .shift-badge {
    display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 600;
    letter-spacing: 0.02em; text-transform: uppercase; padding: 3px 7px; border-radius: 999px;
    background: var(--shift-bg); color: var(--shift); white-space: nowrap;
  }
  .game-row .badges { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .market-group { margin-bottom: 14px; }
  .market-group h4 { font-size: 11px; text-transform: uppercase; color: var(--muted);
    letter-spacing: 0.05em; margin: 0 0 4px; font-weight: 600; }
  .line-row {
    display: flex; justify-content: space-between; align-items: center; padding: 6px 8px;
    border-bottom: 1px solid var(--border); font-size: 13px; border-radius: 4px;
  }
  .line-row.best { background: var(--best-bg); }
  .line-row.worst { background: var(--worst-bg); }
  .line-row .book { text-transform: capitalize; }
  .line-row .value { display: flex; align-items: center; gap: 6px; }
  .line-row.best .value { color: var(--best); font-weight: 600; }
  .line-row.worst .value { color: var(--worst); }
  .movement { font-size: 11px; color: var(--muted); }
  .movement.major { color: var(--shift); font-weight: 600; }
  #detail {
    position: fixed; inset: 0; background: var(--bg); overflow-y: auto; padding: 16px;
    display: none;
  }
  #detail.open { display: block; }
  #detail .back { color: var(--signal); background: none; border: none; font-size: 15px;
    padding: 8px 0; cursor: pointer; font-family: "Inter", sans-serif; }
  #detail h2 { margin: 8px 0 4px; font-size: 20px; }
  #detail section { margin-top: 20px; }
  #detail section h3 { font-size: 12px; text-transform: uppercase; color: var(--muted);
    letter-spacing: 0.06em; margin-bottom: 8px; font-family: "Inter", sans-serif; font-weight: 600; }
  .row { display: flex; justify-content: space-between; padding: 7px 0;
    border-bottom: 1px solid var(--border); font-size: 14px; }
  .prediction-pending {
    background: var(--pending-bg); border: 1px solid #38404d; color: var(--pending);
    padding: 10px 12px; border-radius: 8px; font-size: 13px;
  }
  .not-available-note {
    color: var(--muted); font-size: 12px; padding: 6px 0; font-style: italic;
  }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  #loading { color: var(--muted); padding: 20px 0; text-align: center; }
  .view-tabs { display: flex; gap: 4px; margin: 0 16px 12px; }
  .view-tabs button {
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    font-family: "Inter", sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.03em;
    text-transform: uppercase; padding: 7px 14px; border-radius: 6px; cursor: pointer;
  }
  .view-tabs button.active { color: var(--signal); border-color: #4a3f22; background: #221d10; }
  #team-filter {
    width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    font-family: "Inter", sans-serif; font-size: 13px; padding: 8px 12px; border-radius: 6px;
    margin-bottom: 10px;
  }
  #team-filter::placeholder { color: var(--muted); }
  table.cheatsheet { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.cheatsheet th {
    text-align: left; font-size: 10px; text-transform: uppercase; color: var(--muted);
    letter-spacing: 0.04em; padding: 6px 8px; border-bottom: 1px solid var(--border);
  }
  table.cheatsheet td { padding: 8px; border-bottom: 1px solid var(--border); }
  table.cheatsheet tr:hover td { background: var(--pending-bg); cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>NFL Model -- Live</h1>
  <select id="sport-select">
    <option value="NFL">NFL</option>
  </select>
</header>
<div class="week-nav">
  <button class="week-label" id="week-label" onclick="toggleWeekDropdown()">
    2026 SEASON &mdash; WEEK <span id="week-number">&hellip;</span>
    <span class="chevron">&#9662;</span>
  </button>
  <div class="week-dropdown" id="week-dropdown"></div>
</div>
<div id="model-banner">Loading model status...</div>
<div class="view-tabs">
  <button id="tab-games" class="active" onclick="switchView('games')">Games</button>
  <button id="tab-cheatsheet" onclick="switchView('cheatsheet')">Cheat Sheet</button>
</div>
<main>
  <input id="team-filter" type="text" placeholder="Filter by team (e.g. SEA)&hellip;" oninput="applyTeamFilter()">
  <div id="loading">Loading real games...</div>
  <div id="games"></div>
  <div id="cheatsheet-view" style="display:none"></div>
</main>

<div id="detail">
  <button class="back" onclick="closeDetail()">&larr; Back</button>
  <div id="detail-content"></div>
</div>

<script>
const API = "";  // real, live API is same-origin (this page is served by the FastAPI service)
let currentWeek = null;
let viewingWeek = null;
let loadedGames = [];   // real, currently-loaded week's games -- source for both views + filter
let activeView = "games";

async function loadModelBanner() {
  try {
    const res = await fetch(`${API}/sports/NFL/model-versions`);
    const versions = await res.json();
    const prod = versions.find(v => v.status === "PRODUCTION");
    document.getElementById("model-banner").innerHTML = prod
      ? `Live model: <b>${prod.version_name}</b> (PRODUCTION)`
      : `No model currently marked PRODUCTION -- real predictions are not yet being served live.`;
  } catch (e) {
    document.getElementById("model-banner").textContent = "Real model-version check failed.";
  }
}

function statusPillClass(status) {
  if (status === "READY" || status === "PREDICTED") return "status-pill ready";
  return "status-pill";
}

function fmtKickoff(iso) {
  if (!iso) return "Kickoff TBD";
  const d = new Date(iso);
  return d.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric",
    hour: "numeric", minute: "2-digit" });
}

function buildWeekDropdown() {
  const dd = document.getElementById("week-dropdown");
  const weeks = Array.from({ length: 18 }, (_, i) => i + 1);
  dd.innerHTML = weeks.map(w => `
    <button class="${w === viewingWeek ? 'current' : ''}" onclick="selectWeek(${w})">
      Week ${w}${w === currentWeek ? " (current)" : ""}
    </button>
  `).join("");
}

function toggleWeekDropdown() {
  document.getElementById("week-dropdown").classList.toggle("open");
}

function selectWeek(w) {
  viewingWeek = w;
  document.getElementById("week-dropdown").classList.remove("open");
  document.getElementById("week-number").textContent = w;
  buildWeekDropdown();
  loadGames();
}

async function loadCurrentWeek() {
  try {
    const res = await fetch(`${API}/sports/NFL/current-week`);
    if (!res.ok) throw new Error(`Real API returned HTTP ${res.status}`);
    const data = await res.json();
    currentWeek = data.week;
    viewingWeek = data.week;
    document.getElementById("week-number").textContent = viewingWeek;
    buildWeekDropdown();
  } catch (e) {
    document.getElementById("week-number").textContent = "?";
    console.error("Real error loading current week:", e.message);
  }
}

function gameRowHtml(g) {
  return `
    <div class="game-row" onclick="openDetail('${g.game_id}')">
      <div>
        <div class="teams">${g.away_team} @ ${g.home_team}</div>
        <div class="meta">${fmtKickoff(g.kickoff_time)}</div>
      </div>
      <div class="badges">
        <span class="${statusPillClass(g.status)}">${g.status.replace(/_/g, " ")}</span>
        ${g.has_major_shift ? '<span class="shift-badge">&#9650; Line moved</span>' : ""}
      </div>
    </div>
  `;
}

// Real, additive second top-level view -- not a replacement for the per-game list. Same real
// games/data, denser one-glance layout. Deliberately no populated prediction/edge column yet
// (no real predictions exist for any 2026 game) -- the real structure (columns, sort-readiness)
// is built now so it needs no further work once Week 4's real predictions start populating it.
function cheatsheetHtml(games) {
  if (!games.length) return '<div class="empty">No real games scheduled for this week yet.</div>';
  const rows = games.map(g => `
    <tr onclick="openDetail('${g.game_id}')">
      <td>${g.away_team} @ ${g.home_team}</td>
      <td>${fmtKickoff(g.kickoff_time)}</td>
      <td><span class="${statusPillClass(g.status)}">${g.status.replace(/_/g, " ")}</span></td>
      <td>${g.has_major_shift ? '<span class="shift-badge">&#9650; moved</span>' : "--"}</td>
    </tr>
  `).join("");
  return `
    <table class="cheatsheet">
      <thead><tr><th>Matchup</th><th>Kickoff</th><th>Status</th><th>Market</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function renderCurrentView() {
  const filterTerm = document.getElementById("team-filter").value.trim().toUpperCase();
  const filtered = filterTerm
    ? loadedGames.filter(g => g.home_team.includes(filterTerm) || g.away_team.includes(filterTerm))
    : loadedGames;
  const gamesEl = document.getElementById("games");
  const sheetEl = document.getElementById("cheatsheet-view");
  if (activeView === "games") {
    gamesEl.style.display = "block";
    sheetEl.style.display = "none";
    gamesEl.innerHTML = filtered.length
      ? filtered.map(gameRowHtml).join("")
      : '<div class="empty">No real games match that filter.</div>';
  } else {
    gamesEl.style.display = "none";
    sheetEl.style.display = "block";
    sheetEl.innerHTML = cheatsheetHtml(filtered);
  }
}

function applyTeamFilter() {
  renderCurrentView();
}

function switchView(view) {
  activeView = view;
  document.getElementById("tab-games").classList.toggle("active", view === "games");
  document.getElementById("tab-cheatsheet").classList.toggle("active", view === "cheatsheet");
  renderCurrentView();
}

async function loadGames() {
  const loading = document.getElementById("loading");
  loading.style.display = "block";
  loading.textContent = "Loading real games...";
  document.getElementById("games").innerHTML = "";
  document.getElementById("cheatsheet-view").innerHTML = "";
  try {
    const res = await fetch(`${API}/sports/NFL/games?week=${viewingWeek}`);
    if (!res.ok) throw new Error(`Real API returned HTTP ${res.status}`);
    loadedGames = await res.json();
    loading.style.display = "none";
    renderCurrentView();
  } catch (e) {
    loading.textContent = `Real error loading games: ${e.message}`;
  }
}

// Real, purely market-observational rendering -- factual statements about what the real,
// current market is doing ("DraftKings currently offers the best number," "this line has
// moved 3.0+ points since opening"), never a recommendation or "value" in the betting sense.
function fmtLineValue(m) {
  if (m.market_type === "moneyline") return m.odds != null ? m.odds : "--";
  const line = m.line_value != null ? (Number(m.line_value) > 0 ? `+${m.line_value}` : m.line_value) : "--";
  const odds = m.odds != null ? ` (${Number(m.odds) > 0 ? "+" : ""}${m.odds})` : "";
  return `${line}${odds}`;
}

function renderMarketLines(marketLines) {
  if (!marketLines.length) return '<div class="empty">No real market lines captured yet.</div>';
  const groups = {};
  marketLines.forEach(m => (groups[m.market_type] = groups[m.market_type] || []).push(m));
  const order = ["spread", "total", "moneyline"];
  return Object.keys(groups).sort((a, b) => order.indexOf(a) - order.indexOf(b)).map(mtype => {
    const rows = groups[mtype].map(m => {
      const cls = m.best_value ? "best" : m.worst_value ? "worst" : "";
      let movementHtml = "";
      if (m.movement_status === "MEASURED" && m.line_movement !== undefined) {
        const delta = Number(m.line_movement);
        const isMajor = m.major_shift;
        movementHtml = delta === 0
          ? '<span class="movement">no real movement since opening</span>'
          : `<span class="movement${isMajor ? " major" : ""}">${isMajor ? "&#9650; " : ""}opened ${m.opening_line_value} &rarr; ${Math.abs(delta).toFixed(1)}pt ${delta > 0 ? "up" : "down"}</span>`;
      } else if (m.movement_status === "MEASURED" && m.odds_movement !== undefined) {
        const oddsDelta = Number(m.odds_movement);
        movementHtml = oddsDelta === 0
          ? '<span class="movement">no real odds movement since opening</span>'
          : `<span class="movement">opened ${m.opening_odds} &rarr; moved ${Math.abs(oddsDelta)} ${oddsDelta > 0 ? "better" : "worse"}</span>`;
      } else if (m.movement_status === "INSUFFICIENT_DATA") {
        movementHtml = '<span class="movement">only one real capture so far -- insufficient data for movement</span>';
      } else if (m.movement_status === "NO_REAL_PREGAME_DATA") {
        movementHtml = '<span class="movement">no real pregame data captured</span>';
      }
      return `
        <div class="line-row ${cls}">
          <span class="book">${m.sportsbook.replace(/_/g, " ")}</span>
          <div class="value">${movementHtml}<span>${fmtLineValue(m)}</span></div>
        </div>
      `;
    }).join("");
    return `<div class="market-group"><h4>${mtype}</h4>${rows}</div>`;
  }).join("");
}

async function openDetail(gameId) {
  const detail = document.getElementById("detail");
  const content = document.getElementById("detail-content");
  content.innerHTML = "Loading real game data...";
  detail.classList.add("open");
  try {
    const res = await fetch(`${API}/sports/NFL/games/${encodeURIComponent(gameId)}`);
    if (!res.ok) throw new Error(`Real API returned HTTP ${res.status}`);
    const g = await res.json();

    const injuriesHtml = g.injuries.length
      ? g.injuries.map(i => `
          <div class="row"><span>${i.player_name} (${i.team}, ${i.position || "?"})</span>
          <span>${i.report_status || "--"}</span></div>
        `).join("")
      : '<div class="empty">No real injury reports for either team right now.</div>';

    const marketHtml = renderMarketLines(g.market_lines);

    // Real, honest "What we know so far" section for a game with no prediction yet -- real
    // current market lines (the one real data point actually available), plus an explicit,
    // honest note that Season Win Totals aren't a real data point at all right now (not
    // available from the current odds provider at any tier -- a genuine gap, not fabricated).
    let bodyHtml;
    if (g.prediction && g.prediction.status === "NOT_YET_AVAILABLE") {
      bodyHtml = `
        <section>
          <h3>What we know so far</h3>
          <div class="prediction-pending" style="margin-bottom:12px">${g.prediction.reason}</div>
          <div class="not-available-note">Season Win Totals: not available from the current real data source.</div>
          <div style="margin-top:10px">${marketHtml}</div>
        </section>
      `;
    } else if (g.prediction) {
      bodyHtml = `
        <section>
          <h3>Prediction</h3>
          <div class="row"><span>Projected margin (home)</span><span style="color:var(--signal)">${g.prediction.projected_margin}</span></div>
          <div class="row"><span>Home win probability</span><span style="color:var(--signal)">${(g.prediction.home_win_probability * 100).toFixed(1)}%</span></div>
          <div class="row"><span>Model version</span><span>${g.prediction.version_name}</span></div>
        </section>
        <section><h3>Market lines</h3>${marketHtml}</section>
      `;
    } else {
      bodyHtml = `<section><h3>Market lines</h3>${marketHtml}</section>`;
    }

    content.innerHTML = `
      <h2>${g.away_team} @ ${g.home_team}</h2>
      <div class="meta" style="color:var(--muted)">Week ${g.week} &middot; ${fmtKickoff(g.kickoff_time)}</div>
      <span class="${statusPillClass(g.status)}">${g.status.replace(/_/g, " ")}</span>
      ${bodyHtml}
      <section><h3>Injuries</h3>${injuriesHtml}</section>
    `;
  } catch (e) {
    content.innerHTML = `<button class="back" onclick="closeDetail()">&larr; Back</button>
      <div class="prediction-pending">Real error loading game detail: ${e.message}</div>`;
  }
}

function closeDetail() {
  document.getElementById("detail").classList.remove("open");
}

document.addEventListener("click", (e) => {
  const nav = document.querySelector(".week-nav");
  if (nav && !nav.contains(e.target)) {
    document.getElementById("week-dropdown").classList.remove("open");
  }
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}

loadModelBanner();
loadCurrentWeek().then(loadGames);
</script>
</body>
</html>
