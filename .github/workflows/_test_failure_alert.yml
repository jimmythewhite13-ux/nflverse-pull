name: TEST -- deliberate failure (delete after real email check)

# Real, safe, isolated, manual-only test workflow -- verify_github_failure_email.md. Deliberately
# fails on purpose so we can confirm whether GitHub's own built-in "notify repo owner on
# scheduled/workflow failure" email actually arrives, before building any custom Discord/Slack
# webhook alerting. Delete this file once the real test is confirmed one way or the other.
on:
  workflow_dispatch: {}

jobs:
  fail-on-purpose:
    runs-on: ubuntu-latest
    steps:
      - name: Deliberately fail
        run: exit 1
