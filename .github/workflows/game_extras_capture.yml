name: Game-extras capture (1H lines + team totals, real, US-only)

# Real, sibling to player_props_capture.yml -- same once-daily cadence, same per-event endpoint,
# same real US-only scope (explicit user go-ahead 2026-09-12 after the real, measured cost: 4
# credits/event for h2h_h1 + spreads_h1 + totals_h1 + team_totals combined).
#
# Real, deliberate manual-trigger-only for now: a NEW capture path, not yet run end-to-end.
# `workflow_dispatch` lets it be triggered manually to confirm real data lands correctly in the
# DB and renders in the API/PWA before the `schedule` trigger below is uncommented -- same
# test-before-automate sequencing already used for player_props_capture.yml.
on:
  # schedule:
  #   - cron: '0 13 * * *'   # uncomment once a real manual test run has been verified end-to-end
  workflow_dispatch: {}

permissions:
  contents: write   # real, required: this job commits real ingested data back to the repo

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Self-enforcement check (BEFORE)
        run: uv run python -m prediction_audit.ingestion.self_enforcement_check

      - name: Resolve current NFL season
        id: season
        run: echo "season=$(uv run python -m prediction_audit.ingestion.season)" >> "$GITHUB_OUTPUT"

      - name: Capture real game-extras lines and push (retries on concurrent-push conflict)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          git config user.name "nfl-model-agent[bot]"
          git config user.email "actions@github.com"
          for attempt in 1 2 3 4 5; do
            echo "=== Attempt $attempt ==="
            git fetch origin main
            git reset --hard origin/main
            uv run python -m prediction_audit.ingestion.game_extras --season ${{ steps.season.outputs.season }}
            git add prediction_audit/db/prediction_audit.sqlite3
            if git diff --cached --quiet; then
              echo "No real data changes to commit (cadence gate skipped, or nothing due)."
              break
            fi
            git commit -m "chore(ingestion): game extras capture $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push; then
              echo "Real push succeeded on attempt $attempt."
              break
            fi
            echo "Real push rejected (concurrent writer) -- retrying with fresh state."
            sleep $(( (RANDOM % 10) + 2 ))
            if [ "$attempt" = "5" ]; then
              echo "::error::Real push failed after 5 attempts -- concurrent-writer contention did not clear."
              exit 1
            fi
          done

      - name: Self-enforcement check (AFTER)
        run: uv run python -m prediction_audit.ingestion.self_enforcement_check
