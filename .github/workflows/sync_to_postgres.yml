name: Sync live data to Postgres (real, live PWA replica)

# Real, previously-missing piece: sync_sqlite_to_postgres.py existed and worked (verified
# manually, repeatedly) but had never actually been wired into a scheduled workflow -- the live
# PWA/API was only ever as fresh as whoever's last manual run. Real fix: this workflow, hourly,
# offset 20 minutes past the hour so it typically runs after line_capture.yml's own real hourly
# tick has had a chance to land. This is a one-way SQLite -> Postgres read replica sync; it never
# writes back to this repo, so it needs no `contents: write` permission and no git commit/push.
on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Sync real live data to Postgres
        env:
          DATABASE_URL: ${{ secrets.NFLVERSE_DB_PULL }}
        run: uv run python prediction_audit/sync_sqlite_to_postgres.py
