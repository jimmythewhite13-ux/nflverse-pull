name: Line-movement capture (real CLV)

# Real, deliberate fix vs. the governing spec's own literal 2-cron design (documented in
# prediction_audit/ingestion/market_lines.py's own `_should_capture_now()` docstring): two
# separate cron entries (`0 */6 * * *` and `0 * * * *`) in one schedule list double-fire at
# every hour that's a multiple of 6 (both trigger independently), and cron itself has no way to
# express "closer to a real kickoff = more frequent" at all. Real fix: ONE workflow, ONE hourly
# cron trigger, and the SCRIPT decides each tick whether to actually spend a real API credit --
# always within 24h of the real nearest kickoff (achieves real hourly cadence near kickoff),
# otherwise only if >=6 real hours have passed since the last real capture (achieves real
# 6-hourly cadence the rest of the week). Same real outcome the spec asked for, without the
# double-fire bug or the "cron can't see the schedule" gap.
on:
  schedule:
    - cron: '0 * * * *'   # every hour; the real cadence gate inside market_lines.py throttles it
  workflow_dispatch: {}

permissions:
  contents: write   # real, required: this job commits real ingested data back to the repo

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Self-enforcement check (BEFORE)
        run: uv run python -m prediction_audit.ingestion.self_enforcement_check

      - name: Resolve current NFL season
        id: season
        run: echo "season=$(uv run python -m prediction_audit.ingestion.season)" >> "$GITHUB_OUTPUT"

      # Real, deliberate retry-the-whole-cycle design -- see daily_refresh.yml's own comment
      # for the full real rationale (a real concurrent-push race between these two workflows
      # was hit and caught on the very first live run of this agent layer).
      - name: Capture real market lines and push (retries on concurrent-push conflict)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          git config user.name "nfl-model-agent[bot]"
          git config user.email "actions@github.com"
          for attempt in 1 2 3 4 5; do
            echo "=== Attempt $attempt ==="
            git fetch origin main
            git reset --hard origin/main
            uv run python -m prediction_audit.ingestion.market_lines --season ${{ steps.season.outputs.season }}
            git add prediction_audit/db/prediction_audit.sqlite3
            if git diff --cached --quiet; then
              echo "No real data changes to commit (cadence gate skipped, or nothing new)."
              break
            fi
            git commit -m "chore(ingestion): line capture $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push; then
              echo "Real push succeeded on attempt $attempt."
              break
            fi
            echo "Real push rejected (concurrent writer) -- retrying with fresh state."
            sleep $(( (RANDOM % 10) + 2 ))
            if [ "$attempt" = "5" ]; then
              echo "::error::Real push failed after 5 attempts -- concurrent-writer contention did not clear."
              exit 1
            fi
          done

      - name: Self-enforcement check (AFTER)
        run: uv run python -m prediction_audit.ingestion.self_enforcement_check
